version: '3.8'

# Development Docker Compose - For local testing before deployment

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: socialsearcher_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-socialsearcher_dev}
      POSTGRES_USER: ${POSTGRES_USER_DEV:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:-devpass123}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialsearcher_dev_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER_DEV:-devuser}:${POSTGRES_PASSWORD_DEV:-devpass123}@postgres:5432/${POSTGRES_DB_DEV:-socialsearcher_dev}
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dev_network

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: socialsearcher_dev_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host
    networks:
      - dev_network

volumes:
  postgres_dev_data:
    driver: local

networks:
  dev_network:
    driver: bridge
